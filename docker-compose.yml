
services:
  postgresdb:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: aquariumdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - springboot-postgres-net

  backend:
    image: karthikpolarathi/docker-backend-2400032266:latest
    container_name: docker-springboot
    ports:
      - "8003:8003"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/aquariumdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: docker
    depends_on:
      - postgresdb
    restart: on-failure
    networks:
      - springboot-postgres-net

  frontend:
    image: karthikpolarathi/docker-frontend-2400032266:latest
    container_name: docker-react
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: on-failure
    networks:
      - springboot-postgres-net

volumes:
  postgres_data:

networks:
  springboot-postgres-net:
